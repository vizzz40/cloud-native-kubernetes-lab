# Pod addresses are assigned by kubeadm and come from the node PodCIDRs
ipam:
  mode: kubernetes

k8s:
  requireIPv4PodCIDR: true

# Cross-node Pod networking uses an overlay
routingMode: tunnel
tunnelProtocol: vxlan

kubeProxyReplacement: false

# Generic datapath for now
bpf:
  datapathMode: veth

operator:
  replicas: 1

hubble:
  enabled: false

# The current cluster is IPv4-only.
ipv4:
  enabled: true

ipv6:
  enabled: false