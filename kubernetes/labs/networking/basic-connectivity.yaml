apiVersion: v1
kind: Namespace
metadata:
  name: networking-lab
  labels:
    app.kubernetes.io/part-of: networking-lab
---
apiVersion: v1
kind: Pod
metadata:
  name: net-server
  namespace: networking-lab
  labels:
    app.kubernetes.io/name: net-server
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-2
  containers:
    - name: nginx
      image: nginx:1.27.5-alpine
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 80
  terminationGracePeriodSeconds: 5
---
apiVersion: v1
kind: Pod
metadata:
  name: net-client
  namespace: networking-lab
  labels:
    app.kubernetes.io/name: net-client
spec:
  nodeSelector:
    kubernetes.io/hostname: k8s-worker-1
  containers:
    - name: busybox
      image: busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - while true; do sleep 3600; done
  terminationGracePeriodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: net-server
  namespace: networking-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: net-server
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
