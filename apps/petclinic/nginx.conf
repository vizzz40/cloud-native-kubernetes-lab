# Load inside Nginx's http context, as /etc/nginx/conf.d/default.conf.
server {
    # Listen inside the frontend container, not directly on the laptop.
    listen 8080;
    server_name _;

    # Serve Angular files produced by the web image's build stage.
    root /usr/share/nginx/html;
    index index.html;

    # Check Nginx itself; this does not check the API or database.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nginx contacts the API Service on behalf of the browser.
    # This Service must exist in the same namespace at Nginx startup.
    location /petclinic/ {
        # No URI suffix: preserve /petclinic/... in the forwarded request.
        proxy_pass http://petclinic-api:9966;

        proxy_http_version 1.1;
        # Pass the original host and proxy connection details to the app.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bound connection wait time and the gap between upstream reads.
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        # Let Angular handle routes that are not real files or folders.
        try_files $uri $uri/ /index.html;
    }
}
